<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cube Academy</title>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      color: white;
      font-family: sans-serif;
    
      background-image: url("background.png");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .container {
      width: 90%;
      max-width: 800px;
      text-align: center;
      padding: 20px 0;
    }
    h1 {
      color: gold;
      font-size: 60px;
      margin-bottom: 0.5em;
      letter-spacing:10px;
      text-shadow: 2px 2px 5px  rgb(139, 107, 0);
    }

    p {
      font-size: 20px;
      line-height: 1.6;
      margin-bottom: 1em;
    }

    .welcome-text {
      color: orange;
    }

    .thanks-text {
      color: lightblue;
    }

    .start-button-container {
      margin: 2em 0;
    }

    .start-button {
      display: inline-block;
      border: 5px solid blue;
      padding: 15px 30px;
      font-size: clamp(1.2rem, 3vw, 2rem);
      color: white;
      text-decoration: none;
      transition: background-color 0.3s, transform 0.1s;
    }

    .start-button:hover {
      background-color: rgba(0, 0, 255, 0.2);
    }
    
    .start-button:active {
      transform: scale(0.95);
    }


    a {
      color: white;
    }

    hr {
      width: 100%;
      border-color: rgba(255, 255, 255, 0.3);
      margin: 1.5em 0;
    }

    footer {
      color: lime;
      font-size: clamp(0.8rem, 1.5vw, 1rem);
      margin-top: 1em;
    }

    @media (max-width: 768px) {
      body {
        background-image: url("cpbg.png");
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Cube Academy</h1>
    
    <hr>
    
    <p class="welcome-text">
      Welcome to Cube Academy!<br>
      This website contains all of the algorithms for every case in solving a Rubik's cube, including F2L, OLL, and PLL.<br>
    </p>
    
    <hr>
    <p>Please click start to proceed</p>
    <div class="start-button-container">
      <a href="home.html" class="start-button">Start</a>
    </div>
    
    <hr>
    
    <p class="thanks-text">
      Thank you for visiting!<br>
      Enjoy learning!
    </p>
    
    <hr>
    
    <footer>
      Created by: ©Jay Andrei G. Ilao
    </footer>
  </div>
</body>
</html>
